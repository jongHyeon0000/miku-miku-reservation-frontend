<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" viewBox="0 0 1080 400" font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0.5" y="0.5" width="1079" height="399" rx="14" fill="#0f172a" stroke="#334155"/><text x="24" y="34" font-size="18" font-weight="700" fill="#f1f5f9" text-anchor="start">시스템 구성</text><rect x="24" y="45" width="16" height="16" rx="4" fill="#78350f" stroke="#fbbf24" stroke-width="1.5"/><text x="48" y="58" font-size="12" fill="#cbd5e1" text-anchor="start">클라이언트</text><rect x="130" y="45" width="16" height="16" rx="4" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/><text x="154" y="58" font-size="12" fill="#cbd5e1" text-anchor="start">웹 서버</text><rect x="222" y="45" width="16" height="16" rx="4" fill="#14532d" stroke="#4ade80" stroke-width="1.5"/><text x="246" y="58" font-size="12" fill="#cbd5e1" text-anchor="start">프론트, 백엔드</text><rect x="30" y="150" width="200" height="72" rx="10" fill="#78350f" stroke="#fbbf24" stroke-width="1.6"/><text x="130" y="182.5" font-size="14" font-weight="700" fill="#f1f5f9" text-anchor="middle">클라이언트 (브라우저)</text><text x="130" y="199.5" font-size="12" fill="#cbd5e1" text-anchor="middle">React 화면 실행 (CSR)</text><rect x="330" y="150" width="240" height="72" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.6"/><text x="450" y="174" font-size="14" font-weight="700" fill="#f1f5f9" text-anchor="middle">Nginx</text><text x="450" y="191" font-size="12" fill="#cbd5e1" text-anchor="middle">외부 요청 진입점</text><text x="450" y="208" font-size="12" fill="#cbd5e1" text-anchor="middle">HTTPS 종단, 경로별 라우팅</text><rect x="660" y="70" width="240" height="84" rx="10" fill="#14532d" stroke="#4ade80" stroke-width="1.6"/><text x="780" y="100" font-size="14" font-weight="700" fill="#f1f5f9" text-anchor="middle">프론트 정적 파일 (이 저장소)</text><text x="780" y="117" font-size="12" fill="#cbd5e1" text-anchor="middle">React 빌드 결과 (dist)</text><text x="780" y="134" font-size="12" fill="#cbd5e1" text-anchor="middle">없는 경로는 index.html로 연결</text><rect x="660" y="230" width="240" height="84" rx="10" fill="#14532d" stroke="#4ade80" stroke-width="1.6"/><text x="780" y="260" font-size="14" font-weight="700" fill="#f1f5f9" text-anchor="middle">Spring Boot (백엔드)</text><text x="780" y="277" font-size="12" fill="#cbd5e1" text-anchor="middle">/api  /uploads</text><text x="780" y="294" font-size="12" fill="#cbd5e1" text-anchor="middle">별도 저장소</text><path d="M230,186 L330,186" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="256.2" y="176" width="47.6" height="20" rx="5" fill="#0f172a" fill-opacity="0.95" stroke="#475569"/><text x="280" y="190" font-size="12" fill="#f1f5f9" text-anchor="middle">HTTPS</text><path d="M570,170 L660,115" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="577.28" y="132" width="75.44" height="20" rx="5" fill="#0f172a" fill-opacity="0.95" stroke="#475569"/><text x="615" y="146" font-size="12" fill="#f1f5f9" text-anchor="middle">그 외 경로</text><path d="M570,202 L660,265" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="565" y="233" width="100" height="20" rx="5" fill="#0f172a" fill-opacity="0.95" stroke="#475569"/><text x="615" y="247" font-size="12" fill="#f1f5f9" text-anchor="middle">/api, /uploads</text><text x="30" y="370" font-size="12" fill="#cbd5e1" text-anchor="start">화면은 한 번 내려받은 뒤 브라우저에서 그리고, 데이터는 같은 도메인의 /api로 요청해요 (CORS 없음)</text></svg>
