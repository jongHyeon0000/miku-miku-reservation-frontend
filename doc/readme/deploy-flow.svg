<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="300" viewBox="0 0 1080 300" font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0.5" y="0.5" width="1079" height="299" rx="14" fill="#0f172a" stroke="#334155"/><text x="24" y="34" font-size="18" font-weight="700" fill="#f1f5f9" text-anchor="start">배포 흐름 (GitHub Actions)</text><rect x="24" y="45" width="16" height="16" rx="4" fill="#78350f" stroke="#fbbf24" stroke-width="1.5"/><text x="48" y="58" font-size="12" fill="#cbd5e1" text-anchor="start">개발자</text><rect x="110" y="45" width="16" height="16" rx="4" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/><text x="134" y="58" font-size="12" fill="#cbd5e1" text-anchor="start">GitHub, 확인</text><rect x="237" y="45" width="16" height="16" rx="4" fill="#14532d" stroke="#4ade80" stroke-width="1.5"/><text x="261" y="58" font-size="12" fill="#cbd5e1" text-anchor="start">서버 작업</text><rect x="35" y="110" width="190" height="84" rx="10" fill="#78350f" stroke="#fbbf24" stroke-width="1.6"/><text x="130" y="148.5" font-size="14" font-weight="700" fill="#f1f5f9" text-anchor="middle">개발자</text><text x="130" y="165.5" font-size="12" fill="#cbd5e1" text-anchor="middle">git push (main)</text><rect x="295" y="110" width="190" height="84" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.6"/><text x="390" y="148.5" font-size="14" font-weight="700" fill="#f1f5f9" text-anchor="middle">GitHub Actions</text><text x="390" y="165.5" font-size="12" fill="#cbd5e1" text-anchor="middle">npm ci, 타입 검사, 빌드</text><rect x="555" y="110" width="190" height="84" rx="10" fill="#14532d" stroke="#4ade80" stroke-width="1.6"/><text x="650" y="148.5" font-size="14" font-weight="700" fill="#f1f5f9" text-anchor="middle">서버에 올리기</text><text x="650" y="165.5" font-size="12" fill="#cbd5e1" text-anchor="middle">SSH, rsync로 dist 동기화</text><rect x="815" y="110" width="190" height="84" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.6"/><text x="910" y="148.5" font-size="14" font-weight="700" fill="#f1f5f9" text-anchor="middle">접속 확인</text><text x="910" y="165.5" font-size="12" fill="#cbd5e1" text-anchor="middle">사이트가 200으로 응답</text><path d="M225,152 L295,152" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><path d="M485,152 L555,152" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><path d="M745,152 L815,152" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="35" y="230" width="970" height="44" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="1.4"/><text x="520" y="257" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle">실행 조건: main 브랜치에 푸시하고, 화면 소스나 빌드 설정이 바뀐 경우에만 실행</text></svg>
